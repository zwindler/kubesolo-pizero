apiVersion: v1
kind: Namespace
metadata:
  name: nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: nginx
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events {
      worker_connections 64;
    }
    http {
      access_log off;
      server {
        listen 80;
        location / {
          default_type text/plain;
          return 200 "Hello from KubeSolo on a Raspberry Pi Zero 2 W\n";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.29-alpine-slim
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 8Mi
              cpu: 50m
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
